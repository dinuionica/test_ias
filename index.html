<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task 4 - Tailwind Centering</title>
<!-- Include Tailwind CSS -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-8 space-y-8">
 
<!-- ==================================== -->
<!-- TODO 1: Center using FLEXBOX -->
<!-- flex turns the parent into a flex container,
     justify-center centers on the main axis (horizontal),
     items-center centers on the cross axis (vertical). -->
<!-- ==================================== -->
<div class="h-64 bg-white rounded-lg shadow flex justify-center items-center">
<div class="bg-blue-500 text-white font-semibold px-6 py-4 rounded">
        Centered Box (Flex)
</div>
</div>
 
<!-- ==================================== -->
<!-- TODO 2: Center using GRID -->
<!-- place-items-center is the shorthand for
     align-items: center + justify-items: center. -->
<!-- ==================================== -->
<div class="h-64 bg-white rounded-lg shadow grid place-items-center">
<div class="bg-green-500 text-white font-semibold px-6 py-4 rounded">
        Centered Box (Grid)
</div>
</div>
 
<!-- ==================================== -->
<!-- TODO 3: Center using ABSOLUTE positioning -->
<!-- The parent needs relative so the child positions against it.
     top-1/2 left-1/2 places the child's top-left corner at the centre,
     then the negative translates pull it back by half its own size. -->
<!-- ==================================== -->
<div class="h-64 bg-white rounded-lg shadow relative">
  <div class="h-64 bg-white rounded-lg shadow relative">
    <div class="bg-purple-500 text-white font-semibold px-6 py-4 rounded
                absolute top-0 right-0 bottom-0 left-0 w-fit h-fit m-auto">
      Centered Box (Absolute)
    </div>
  </div>
</div>
 
</body>
</html>
